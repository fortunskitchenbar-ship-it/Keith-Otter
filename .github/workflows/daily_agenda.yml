name: Daily Agenda Builder

on:
  schedule:
    - cron: '30 13 * * *'   # 6:30 AM Pacific (PDT)
    - cron: '30 18 * * *'   # 11:30 AM Pacific (PDT)
    - cron: '30 23 * * *'   # 4:30 PM Pacific (PDT)
    - cron: '30 4 * * *'    # 9:30 PM Pacific (PDT, lands on next UTC date)
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Who triggered this? (claude, chatgpt, manual)'
        required: false
        default: 'manual'

# Both scheduled jobs push to main. Without a shared group they can start in the
# same minute, and whichever pushes second gets "fetch first" and fails.
concurrency:
  group: keith-otter-repo-writer
  cancel-in-progress: false

jobs:
  build-agenda:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests icalendar recurring-ical-events feedparser pytz

      - name: Fetch Google Calendar events
        env:
          GCAL_ICAL_URL: ${{ secrets.GCAL_ICAL_URL }}
        run: python scripts/fetch_calendar.py

      - name: Fetch Fox News headlines
        run: python scripts/fetch_rss.py

      - name: Combine into daily agenda file
        run: python scripts/build_agenda.py

      - name: Commit agenda
        run: |
          set -euo pipefail
          git config user.name "Daily Agenda Bot"
          git config user.email "actions@github.com"
          git add agenda/daily_agenda.txt
          if git diff --cached --quiet; then
            echo "No agenda changes to commit."
            exit 0
          fi
          git commit -m "Daily agenda update"

          # Retry with rebase: another job may have pushed while this one ran.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying in 5s…"
            sleep 5
          done
          echo "Could not push the agenda after 4 attempts." >&2
          exit 1
