name: Auto Commit JSON

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
  workflow_dispatch:
    inputs:
      run_reason:
        description: 'Reason for this run'
        required: false
        default: 'manual'
  schedule:
    - cron: '30 13 * * *'   # 6:30 AM Pacific (PDT)
    - cron: '30 18 * * *'   # 11:30 AM Pacific (PDT)
    - cron: '30 23 * * *'   # 4:30 PM Pacific (PDT)
    - cron: '30 4 * * *'    # 9:30 PM Pacific (PDT, lands on next UTC date)

# Shared with Daily Agenda Builder so the two jobs never push at the same time.
concurrency:
  group: keith-otter-repo-writer
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests python-dateutil feedparser
      - name: Fetch weather
        run: python scripts/fetch_weather.py
      - name: Fetch news
        run: python scripts/fetch_rss.py
      - name: Generate JSON data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_REASON: ${{ github.event.inputs.run_reason || 'scheduled' }}
        run: python scripts/generate_json.py
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Check for JSON changes
        id: json_changes
        run: |
          if [ -n "$(git status --porcelain -- '*.json')" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push JSON changes
        if: steps.json_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add '*.json'
          git commit -m "chore: auto-update JSON data [skip ci]"

          # Retry with rebase: the agenda job may have pushed while this one ran.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying in 5s…"
            sleep 5
          done
          echo "Could not push JSON changes after 4 attempts." >&2
          exit 1
      - name: Report no changes
        if: steps.json_changes.outputs.changed == 'false'
        run: echo "No JSON changes detected — skipping commit"
